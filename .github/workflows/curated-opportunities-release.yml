name: Curated opportunities release checks
on:
  pull_request:
    paths:
      - 'app/content/africa-opportunities-20261104.json'
      - 'app/curated_opportunities_release.php'
      - 'views/desk/**'
      - 'assets/css/curated-opportunities.css'
      - 'tests/curated_opportunities*'
      - '.platform/hooks/postdeploy/37_curated_opportunities.sh'
      - '.github/workflows/curated-opportunities-release.yml'
  workflow_run:
    workflows: ['Deploy production']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-publishing:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: wk-ci-fixture-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwk-ci-fixture-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      WK_TEST_ALLOW_WRITES: '1'
      WK_TEST_DB_HOST: 127.0.0.1
      WK_TEST_DB_USER: root
      WK_TEST_DB_PASS: wk-ci-fixture-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, dom, mbstring, fileinfo, openssl, gd, zip
          tools: composer:v2
          coverage: none
      - name: Install locked application dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Validate all sixteen entries and source/approval contracts
        run: |
          php -l app/curated_opportunities_release.php
          bash -n .platform/hooks/postdeploy/37_curated_opportunities.sh
          php tests/curated_opportunities_test.php
      - name: Rehearse native approval, publication, duplicate prevention and withdrawal safety
        env:
          WK_TEST_DB_PORT: ${{ job.services.mysql.ports[3306] }}
        run: php tests/curated_opportunities_database.php
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_run'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install read-only live browser
        if: github.event_name == 'workflow_run'
        run: |
          npm install --prefix "$RUNNER_TEMP/opportunity-browser" --no-package-lock --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/opportunity-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify all sixteen public pages, archive and sitemap
        if: github.event_name == 'workflow_run'
        env:
          NODE_PATH: ${{ runner.temp }}/opportunity-browser/node_modules
          ARTICLE_EVIDENCE_DIR: ${{ runner.temp }}/curated-opportunities-evidence
        run: node tests/curated_opportunities_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_run'
        with:
          name: curated-opportunities-live-evidence
          path: ${{ runner.temp }}/curated-opportunities-evidence
          if-no-files-found: ignore
          retention-days: 14
