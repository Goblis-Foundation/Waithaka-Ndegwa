name: Application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    # This is a per-job disposable database, not an AWS/RDS connection.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: wk-ci-fixture-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwk-ci-fixture-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      WK_TEST_ALLOW_WRITES: '1'
      WK_TEST_DB_HOST: 127.0.0.1
      WK_TEST_DB_USER: root
      WK_TEST_DB_PASS: wk-ci-fixture-only

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl, dom, mbstring, fileinfo, openssl, gd, zip
          tools: composer:v2
          coverage: none
        env:
          fail-fast: 'true'

      - name: Set up JavaScript syntax checker
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate dependency manifest and lock
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      - name: Check actual runtime requirements
        run: composer check-platform-reqs

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

      - name: Lint PHP and JavaScript
        run: php tests/run.php --lint

      - name: Run isolated application suites
        env:
          WK_TEST_DB_PORT: ${{ job.services.mysql.ports[3306] }}
        run: composer test
