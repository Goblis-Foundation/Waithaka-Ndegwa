name: Integrate reviewed opportunity lifecycle source
on:
  push:
    branches: ['feature/opportunity-lifecycle-20261104']
    paths: ['.github/workflows/lifecycle-integrate.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'Goblis-Foundation/Waithaka-Ndegwa' && github.actor == 'iwaithakaw'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply exact reviewed integration edits on the feature branch only
        run: |
          python3 scripts/opportunity-lifecycle-integrate.py
          php -l app/publishing_desk.php
          php -l app/publishing_desk_policy.php
          php -l app/publishing_desk_routes.php
          php -l app/opportunity_lifecycle.php
          php -l bin/worker.php
          php tests/opportunity_lifecycle_test.php
          rm scripts/opportunity-lifecycle-integrate.py .github/workflows/lifecycle-integrate.yml
      - name: Commit source edits without production access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess,urllib.request,pathlib
          repo='Goblis-Foundation/Waithaka-Ndegwa'; branch='feature/opportunity-lifecycle-20261104'
          assert os.environ['GITHUB_REPOSITORY']==repo and os.environ['GITHUB_REF']=='refs/heads/'+branch
          api='https://api.github.com/repos/'+repo
          def call(method,endpoint,payload=None):
              request=urllib.request.Request(api+endpoint,data=None if payload is None else json.dumps(payload).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          head=call('GET','/git/ref/heads/'+branch)['object']['sha']
          assert head==os.environ['GITHUB_SHA'],'Feature branch changed; do not overwrite'
          allowed={'app/publishing_desk_policy.php','app/publishing_desk.php','app/publishing_desk_routes.php','app/publishing_desk_media.php','app/preparation_status.php','bin/worker.php','app/functions.php','views/write/desk_index.php','views/desk/fields.php','views/desk/article.php','views/desk/index.php','app/monthly_roundup.php','app/discovery.php','bin/build-release.py','scripts/opportunity-lifecycle-integrate.py','.github/workflows/lifecycle-integrate.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==allowed,changed^allowed
          tree=[]
          for name in sorted(changed):
              path=pathlib.Path(name)
              if path.exists():
                  blob=call('POST','/git/blobs',{'content':path.read_text(),'encoding':'utf-8'});sha=blob['sha']
              else:sha=None
              tree.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          base=call('GET','/git/commits/'+head)['tree']['sha']
          newtree=call('POST','/git/trees',{'base_tree':base,'tree':tree})
          commit=call('POST','/git/commits',{'message':'Integrate source monitoring, evidence review, date-aware closure and ninety-day archive','tree':newtree['sha'],'parents':[head]})
          call('PATCH','/git/refs/heads/'+branch,{'sha':commit['sha'],'force':False})
          print(json.dumps({'commit':commit['sha'],'changed_paths':sorted(changed)}))
          PY
