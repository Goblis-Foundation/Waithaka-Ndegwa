name: Inaugural article design checks
on:
  pull_request:
    paths: ['app/inaugural_story.php', 'views/post.php', 'views/partials_inaugural_story.php', 'assets/css/inaugural-story.css', 'assets/js/inaugural-story.js', 'tests/inaugural_story*', '.github/workflows/inaugural-story-design.yml']
  workflow_run:
    workflows: ['Deploy production']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  story:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run is already restricted above to successful deployments from
      # this repository's main branch. Pin acceptance to that deployed SHA so a
      # newer main commit cannot race ahead; PR checks still use github.sha.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check content preservation and original images
        run: php tests/inaugural_story_test.php
      - name: Prepare browser and real template fixtures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/story-fixtures"
          php tests/inaugural_story_render_fixture.php "$RUNNER_TEMP/story-fixtures"
          ln -s "$GITHUB_WORKSPACE/assets" "$RUNNER_TEMP/story-fixtures/assets"
          npm install --prefix "$RUNNER_TEMP/story-browser" --no-package-lock --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/story-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify responsive article without production writes
        env:
          NODE_PATH: ${{ runner.temp }}/story-browser/node_modules
          STORY_EVIDENCE_DIR: ${{ runner.temp }}/story-evidence
          STORY_LIVE: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        run: |
          set -euo pipefail
          python3 -m http.server 8125 --bind 127.0.0.1 --directory "$RUNNER_TEMP/story-fixtures" >"$RUNNER_TEMP/story-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8125/story-article.html >/dev/null && break; sleep 0.2; done
          node tests/inaugural_story_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inaugural-story-design-evidence
          path: ${{ runner.temp }}/story-evidence
          if-no-files-found: ignore
          retention-days: 7
