name: Lifecycle source preparation
on:
  push:
    branches: ['feature/opportunity-lifecycle-20261104']
    paths: ['.github/workflows/lifecycle-source-preparation.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive committed application source only
        run: git archive --format=zip --output=/tmp/lifecycle-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-development-source
          path: /tmp/lifecycle-source.zip
          retention-days: 2
