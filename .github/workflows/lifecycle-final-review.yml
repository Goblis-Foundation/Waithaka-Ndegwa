name: Final lifecycle integration review
on:
  push:
    branches: ['feature/opportunity-lifecycle-20261104']
    paths: ['.github/workflows/lifecycle-final-review.yml']
permissions:
  contents: write
jobs:
  review:
    if: github.repository == 'Goblis-Foundation/Waithaka-Ndegwa' && github.actor == 'iwaithakaw'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply bounded reviewed source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def edit(name,old,new):
              p=Path(name);s=p.read_text();assert old in s,(name,old[:80]);p.write_text(s.replace(old,new,1))
          p='app/opportunity_lifecycle.php'
          edit(p,"$m['last_attempt']=$now;$m['sources']=$sources;","$m['last_attempt']=$now;$m['attempted_sources']=$sources;")
          edit(p,"$m['source_hash']=$hash;$m['texts']=$texts;","$m['source_hash']=$hash;$m['texts']=$texts;$m['sources']=$sources;")
          edit(p,"||($seed['close_reason']??'')==='manual')throw new InvalidArgumentException('Withdrawn", "||($seed['close_reason']??'')==='manual'||!empty($r['closed_reason']))throw new InvalidArgumentException('Withdrawn")
          edit(p,"if(!hash_equals((string)($m['source_hash']??''),(string)($in['source_hash']??''))", "if(($m['fetch_state']??'')!=='checked'||!hash_equals((string)($m['source_hash']??''),(string)($in['source_hash']??''))")
          edit(p,"$new['lifecycle']['revisions']=array_slice([...($seed['revisions']??[]),$revision],-20);$new['owner_approval']=null;$new['state']='review';", "$nextLifecycle=$new['lifecycle'];$nextLifecycle['revisions']=array_slice([...($seed['revisions']??[]),$revision],-20);\n        // Do not expose revised lifecycle metadata before the native public snapshot commits.\n        $new['lifecycle']=$r['lifecycle']??[];$new['owner_approval']=null;$new['state']='review';")
          edit(p,"if($new['public']['fields']['deadline_label']!==$label)throw new RuntimeException('Revision readback failed.');", "if($new['public']['fields']['deadline_label']!==$label)throw new RuntimeException('Revision readback failed.');\n        $new['lifecycle']=$nextLifecycle;$new=desk_store($new,'verified_deadline_published',(string)$uid);")
          edit(p,"if($interval!==null&&empty($m['paused'])&&($m['next_check']??0)<=$now)", "if($interval!==null&&empty($m['paused'])&&min($m['next_check']??0,($m['last_attempt']??0)+$interval)<=$now)")
          edit('app/publishing_desk.php',"if($r['state']==='published'&&desk_closed($r))", "if($r['state']==='published'&&desk_closed(ol_public_record($r)))")
          edit('views/desk/article.php',"<?=ol_boundary($record)['precision']!=='exact'?'The published closing date has passed; the organiser did not supply a verified exact cutoff. ':''?>", "<?=in_array(ol_boundary($record)['precision'],['date','reported_date'],true)&&(ol_boundary($record)['at']??PHP_INT_MAX)<=time()?'The published closing date has passed; the organiser did not supply a verified exact cutoff. ':''?>")
          p='tests/curated_opportunities_browser.cjs'
          edit(p,"assert.ok(body.includes(entry.deadline_label));", "assert.ok(body.includes(entry.deadline_label)||await page.locator('.desk-alert').filter({hasText:'Deadline revised:'}).count()>0,'Original or reviewed deadline shown');")
          edit(p,"assert.ok(sourceLinks.length>=2", "assert.ok(sourceLinks.length>=1")
          edit(p,"assert.ok(await page.locator('.desk-cta a[href=\"'+entry.apply_url+'\"]').count()>0,'Official application/details CTA');", "const lifecycle=await page.locator('[data-opportunity-status]').getAttribute('data-opportunity-status');\n    assert.equal(await page.locator('.desk-cta a.desk-button.primary').count(),lifecycle==='current'?1:0,'Expiry-aware provider action');")
          edit(p,"checks.push({width,status:response.status(),overflow});", "checks.push({width,status:response.status(),overflow,lifecycle});")
          edit(p,"&status=all'", "&status='+((results.find(r=>r.slug===entry.slug).checks[0].lifecycle==='archived')?'archived':'all')")
          edit(p,"for(const entry of catalog.entries)assert.ok(xml.includes('/opportunities/'+entry.slug),'Sitemap includes '+entry.slug);", "for(const entry of catalog.entries)assert.equal(xml.includes('/opportunities/'+entry.slug),results.find(r=>r.slug===entry.slug).checks[0].lifecycle!=='archived','Current sitemap excludes old archives');")
          p='tests/opportunity_guides_browser.cjs'
          edit(p,"const official=page.locator('.desk-cta a.desk-button.primary');assert.equal(await official.getAttribute('href'),entry.apply_url);assert.equal(await official.getAttribute('target'),'_blank');", "const lifecycle=await page.locator('[data-opportunity-status]').getAttribute('data-opportunity-status');const official=page.locator('.desk-cta a.desk-button.primary');assert.equal(await official.count(),lifecycle==='current'?1:0);if(lifecycle==='current'){assert.equal(await official.getAttribute('href'),entry.apply_url);assert.equal(await official.getAttribute('target'),'_blank');}")
          edit(p,"results.push({slug:entry.slug,width,status:response.status(),words,overflow,support:true});", "results.push({slug:entry.slug,width,status:response.status(),words,overflow,support:true,lifecycle});")
          edit(p,"for(const e of data.entries)assert.ok(await page.locator('a[href$=\"/opportunities/'+e.slug+'\"]').count()>0,'Archive retains '+e.slug);", "for(const e of data.entries){const status=results.find(r=>r.slug===e.slug).lifecycle;await page.goto(base+'/opportunities?q='+encodeURIComponent(e.title)+'&status='+(status==='archived'?'archived':'all'),{waitUntil:'networkidle'});assert.equal(await page.locator('.desk-feature-card h2 a[href$=\"/'+e.slug+'\"]').count(),1,'Listing remains discoverable in the correct lifecycle view');}await page.goto(base+'/opportunities',{waitUntil:'networkidle'});")
          edit(p,"for(const e of data.entries)assert.ok(xml.includes('/opportunities/'+e.slug));", "for(const e of data.entries)assert.equal(xml.includes('/opportunities/'+e.slug),results.find(r=>r.slug===e.slug).lifecycle!=='archived');")
          p='tests/opportunity_lifecycle_database.php'
          edit(p,"$failed['last_success']===$m['last_success']", "$failed['last_success']===$m['last_success']&&$failed['sources']===$m['sources']")
          edit(p,"ogd($updated['owner_approval']===$updated['public']['digest'],'Final-copy native approval intact.');", "ogd($updated['owner_approval']===$updated['public']['digest'],'Final-copy native approval intact.');ogd(count($updated['lifecycle']['revisions'])===1,'Public revision evidence appears only after publication.');")
          Path('.github/workflows/lifecycle-final-review.yml').unlink()
          PY
          php -l app/opportunity_lifecycle.php
          php -l views/desk/article.php
          node --check tests/curated_opportunities_browser.cjs
          node --check tests/opportunity_guides_browser.cjs
          git diff --check
      - name: Commit only reviewed corrections to the existing feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess,urllib.request,pathlib
          repo='Goblis-Foundation/Waithaka-Ndegwa';branch='feature/opportunity-lifecycle-20261104';api='https://api.github.com/repos/'+repo
          def call(method,endpoint,payload=None):
              req=urllib.request.Request(api+endpoint,data=None if payload is None else json.dumps(payload).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30)as response:return json.load(response)
          head=call('GET','/git/ref/heads/'+branch)['object']['sha'];assert head==os.environ['GITHUB_SHA']
          allowed={'app/opportunity_lifecycle.php','app/publishing_desk.php','views/desk/article.php','tests/curated_opportunities_browser.cjs','tests/opportunity_guides_browser.cjs','tests/opportunity_lifecycle_database.php','.github/workflows/lifecycle-final-review.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines());assert changed==allowed
          entries=[]
          for name in sorted(changed):
              p=pathlib.Path(name);sha=call('POST','/git/blobs',{'content':p.read_text(),'encoding':'utf-8'})['sha']if p.exists()else None
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          base=call('GET','/git/commits/'+head)['tree']['sha'];tree=call('POST','/git/trees',{'base_tree':base,'tree':entries})
          commit=call('POST','/git/commits',{'message':'Preserve public revision atomicity, source provenance and expiry-aware acceptance','tree':tree['sha'],'parents':[head]})
          call('PATCH','/git/refs/heads/'+branch,{'sha':commit['sha'],'force':False});print(json.dumps({'commit':commit['sha'],'paths':sorted(changed)}))
          PY
