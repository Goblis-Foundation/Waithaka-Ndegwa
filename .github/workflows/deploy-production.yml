name: Deploy production

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/aws-preflight.yml'
      - '.github/workflows/hosting-cost-review.yml'
      - '.github/workflows/restore-history.yml'
      - 'history/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: waithaka-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: wk-ci-fixture-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwk-ci-fixture-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      WK_TEST_ALLOW_WRITES: '1'
      WK_TEST_DB_HOST: 127.0.0.1
      WK_TEST_DB_USER: root
      WK_TEST_DB_PASS: wk-ci-fixture-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, dom, mbstring, fileinfo, openssl, gd, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - run: composer check-platform-reqs
      - run: composer audit --locked --no-interaction
      - run: php tests/run.php --lint
      - name: Run isolated application suites
        env:
          WK_TEST_DB_PORT: ${{ job.services.mysql.ports[3306] }}
        run: composer test

  deploy:
    name: Deploy to AWS account 466401734428
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, dom, mbstring, fileinfo, openssl, gd, zip
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::466401734428:role/WaithakaGitHubDeployRole
          aws-region: af-south-1
          allowed-account-ids: '466401734428'
          unset-current-credentials: true
          retry-max-attempts: 2
          role-session-name: waithaka-github-production

      - name: Verify AWS target
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text --no-cli-pager)" = "466401734428"
          aws sts get-caller-identity --no-cli-pager

      - name: Verify required deployment permissions before any infrastructure change
        id: release_permissions
        run: python3 -B deploy/aws/repair_rolling_role.py --verify-only

      - name: Record blocked release prerequisite
        if: failure() && steps.release_permissions.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Release stopped before infrastructure changes

          The required deployment policy could not be verified. This job did not run DNS recovery or update the environment.

          The authorized IAM administrator must apply the latest reviewed `deploy/aws/repair_rolling_role.py` using an administrator identity, then rerun this GitHub release. The repair attaches a small customer-managed policy, preserving the existing inline policies and their size budget. It includes environment-scoped Auto Scaling termination and only the role/policy reads needed for verification; it adds no IAM self-write permission. Rerun a release from this updated revision, not an older run that only checks inline grants.
          EOF

      - name: Reconstruct Route 53 deployment state
        run: python3 deploy/aws/fresh_dns.py recover

      - name: Build immutable Beanstalk application bundle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/waithaka-release" "../deployment"
          LABEL="gha-${GITHUB_SHA:0:12}"
          python3 bin/build-release.py --output-dir "$RUNNER_TEMP/waithaka-release" --label "$LABEL"
          OUTER="$(find "$RUNNER_TEMP/waithaka-release" -maxdepth 1 -name 'Waithaka-Ndegwa-AWS-Implementation-*.zip' -print -quit)"
          test -n "$OUTER"
          unzip -p "$OUTER" deployment/application.zip > ../deployment/application.zip
          unzip -t ../deployment/application.zip >/dev/null

      - name: Continue production deployment with live availability guard
        run: |
          python3 -B deploy/aws/release_continuity.py \
            --report "$RUNNER_TEMP/live-continuity/deployment.json" \
            --interval 5 -- bash deploy/aws/fresh_hosting.sh --after-registrar

      - name: Apply confirmed Workspace mail relay without a blind restart
        run: |
          python3 -B deploy/aws/release_continuity.py \
            --report "$RUNNER_TEMP/live-continuity/mail-config.json" \
            --interval 5 -- bash deploy/aws/google_workspace.sh --enable

      - name: Retain public outage evidence, including failed releases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waithaka-release-public-continuity
          path: ${{ runner.temp }}/live-continuity/
          if-no-files-found: ignore
          retention-days: 14

      - name: Deployment diagnostics on failure
        if: failure()
        run: |
          echo '=== Elastic Beanstalk environment ==='
          aws elasticbeanstalk describe-environments --environment-names waithaka-ndegwa-production --region af-south-1 --no-cli-pager || true
          echo '=== Recent Elastic Beanstalk events ==='
          aws elasticbeanstalk describe-events --environment-name waithaka-ndegwa-production --region af-south-1 --max-records 40 --no-cli-pager || true
          echo '=== Edge stack ==='
          aws cloudformation describe-stacks --stack-name waithaka-edge --region af-south-1 --no-cli-pager || true

      - name: Read scoped migration diagnostics on failure
        if: failure() && steps.release_permissions.outcome == 'success'
        run: python3 -B deploy/aws/migration_log_diagnostics.py

      - name: Production smoke test
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          base='https://www.waithakandegwa.com'
          def read(path):
              request=urllib.request.Request(base+path,headers={'User-Agent':'Waithaka-Deployment-Verification/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  if response.status!=200: raise RuntimeError('Unexpected HTTP status')
                  return response.read().decode('utf-8')
          for attempt in range(18):
              try:
                  html=read('/')
                  if 'G-RN0YXC2WCH' not in html: raise RuntimeError('Expected GA4 destination not yet visible')
                  if 'My Thoughts' not in html: raise RuntimeError('Expected homepage content not yet visible')
                  if json.loads(read('/healthz')).get('ok') is not True: raise RuntimeError('Application health check is not ready')
                  print('PASS: HTTPS homepage, expected GA4 destination, editorial content and database health.')
                  break
              except Exception as error:
                  print('Verification attempt',attempt+1,'not ready:',type(error).__name__)
                  if attempt==17: raise RuntimeError('Production acceptance checks did not pass after DNS propagation retries') from None
                  time.sleep(10)
          PY

      - name: Verify public search and Kenya-first journeys
        run: python3 -B deploy/aws/verify_public_journeys.py

      - name: Audit site-wide public navigation and entry-point journeys
        run: python3 -B deploy/aws/verify_sitewide_journeys.py

      - name: Verify Goal 2030 section navigation
        run: python3 -B deploy/aws/verify_goal_section_navigation.py
      - name: Verify protected impact and posting workspaces
        run: python3 -B deploy/aws/verify_private_impact_posting.py

      - name: Verify publishing, approved branding and automatic visitor refresh
        run: python3 -B deploy/aws/verify_publishing_release.py

      - name: Verify website and Writer favicon/PWA identity
        run: python3 -B deploy/aws/verify_brand_pwa.py

  live-outline-acceptance:
    name: Verify centered public section selectors on the live website
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated browser for read-only live acceptance
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/outline-browser" --no-package-lock --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/outline-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify centered Home, Start Here, and every checked public selector
        env:
          NODE_PATH: ${{ runner.temp }}/outline-browser/node_modules
          OUTLINE_LIVE: '1'
          OUTLINE_EVIDENCE_DIR: ${{ runner.temp }}/outline-evidence
        run: node tests/outline_navigation_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: centered-live-page-sections
          path: ${{ runner.temp }}/outline-evidence
          if-no-files-found: ignore
          retention-days: 3
