name: EV biofuels article checks
on:
  pull_request:
    paths:
      - 'app/content/electric-vehicles-biofuels-africa.*'
      - 'app/ev_biofuels_header.php'
      - 'assets/images/articles/ev-biofuels-approved-20261104.jpg'
      - 'bin/publish-ev-biofuels-article.php'
      - '.platform/hooks/postdeploy/35_ev_biofuels_article.sh'
      - 'tests/ev_biofuels*'
      - '.github/workflows/ev-biofuels-article.yml'
  workflow_run:
    workflows: ['Deploy production']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  article:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring
          coverage: none
      - name: Validate reviewed article, approved image and exact edit
        run: |
          php -l bin/publish-ev-biofuels-article.php
          php -l app/ev_biofuels_header.php
          bash -n .platform/hooks/postdeploy/35_ev_biofuels_article.sh
          php tests/ev_biofuels_article_test.php
          php tests/ev_biofuels_header_test.php
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_run'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated live browser
        if: github.event_name == 'workflow_run'
        run: |
          npm install --prefix "$RUNNER_TEMP/article-browser" --no-package-lock --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/article-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify live article, exact image and article-free homepage
        if: github.event_name == 'workflow_run'
        env:
          NODE_PATH: ${{ runner.temp }}/article-browser/node_modules
          ARTICLE_EVIDENCE_DIR: ${{ runner.temp }}/ev-biofuels-evidence
        run: node tests/ev_biofuels_article_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_run'
        with:
          name: ev-biofuels-live-evidence
          path: ${{ runner.temp }}/ev-biofuels-evidence
          if-no-files-found: ignore
          retention-days: 14
