name: AWS production preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aws-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose OIDC identity and STS response without exposing tokens
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.parse, urllib.error, xml.etree.ElementTree as ET
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token = json.load(urllib.request.urlopen(req))['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          keys = ('iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner_id', 'ref', 'job_workflow_ref')
          print('OIDC identity:', json.dumps({k: claims.get(k) for k in keys}))
          data = urllib.parse.urlencode({'Action':'AssumeRoleWithWebIdentity', 'Version':'2011-06-15', 'RoleArn':'arn:aws:iam::466401734428:role/WaithakaGitHubDeployRole', 'RoleSessionName':'waithaka-oidc-diagnosis', 'WebIdentityToken':token, 'DurationSeconds':'900'}).encode()
          try:
              urllib.request.urlopen(urllib.request.Request('https://sts.af-south-1.amazonaws.com/',data=data),timeout=30).read()
              print('STS token exchange succeeded; credentials intentionally omitted.')
          except urllib.error.HTTPError as error:
              root = ET.fromstring(error.read())
              for element in root.iter():
                  if element.tag.rsplit('}',1)[-1] in ('Code','Message'): print(element.tag.rsplit('}',1)[-1] + ': ' + (element.text or ''))
          PY
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::466401734428:role/WaithakaGitHubDeployRole
          aws-region: af-south-1
          allowed-account-ids: '466401734428'
          retry-max-attempts: 2
          role-session-name: waithaka-production-preflight
      - name: Verify workload account and inspect existing environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 466401734428
          aws elasticbeanstalk describe-environments --environment-names waithaka-ndegwa-production --region af-south-1
          aws elasticbeanstalk describe-events --environment-name waithaka-ndegwa-production --region af-south-1 --max-records 25
      - name: Inventory fixed-cost resources against accepted USD 113.22 monthly baseline
        shell: bash
        run: |
          set -euo pipefail
          vpc_id=$(aws cloudformation describe-stacks --stack-name waithaka-network --region af-south-1 --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue | [0]" --output text)
          aws ec2 describe-nat-gateways --filter Name=vpc-id,Values="$vpc_id" --region af-south-1 --query 'NatGateways[].[NatGatewayId,State]' --output table
          aws ec2 describe-instances --filters Name=vpc-id,Values="$vpc_id" Name=instance-state-name,Values=running --region af-south-1 --query 'Reservations[].Instances[].[InstanceId,InstanceType]' --output table
          db_id=$(aws cloudformation describe-stack-resource --stack-name waithaka-ndegwa-production-466401734428-data --logical-resource-id Database --region af-south-1 --query StackResourceDetail.PhysicalResourceId --output text)
          aws rds describe-db-instances --db-instance-identifier "$db_id" --region af-south-1 --query 'DBInstances[].[DBInstanceClass,MultiAZ,AllocatedStorage,StorageType,BackupRetentionPeriod]' --output table
      - name: Inspect Cape Town edge stack events
        shell: bash
        run: |
          aws cloudformation describe-stack-events --stack-name waithaka-edge --region af-south-1 --query 'StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' --output table
      - name: Inspect retained data stack update events
        shell: bash
        run: |
          aws cloudformation describe-stack-events --stack-name waithaka-ndegwa-production-466401734428-data --region af-south-1 --query 'StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' --output table
      - name: Inspect startup logs without publishing credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,json,time,urllib.request,zipfile,io,re,datetime
          def aws(*a):
              r=subprocess.run(['aws',*a,'--region','af-south-1','--output','json'],capture_output=True,text=True)
              if r.returncode: raise RuntimeError(r.stderr)
              return json.loads(r.stdout or '{}')
          name='waithaka-ndegwa-production'
          requested=time.time()
          aws('elasticbeanstalk','request-environment-info','--environment-name',name,'--info-type','tail')
          for attempt in range(12):
              time.sleep(10)
              entries=aws('elasticbeanstalk','retrieve-environment-info','--environment-name',name,'--info-type','tail').get('EnvironmentInfo',[])
              entries=[e for e in entries if datetime.datetime.fromisoformat(e.get('SampleTimestamp','1970-01-01T00:00:00+00:00').replace('Z','+00:00')).timestamp() >= requested-5]
              if entries: break
          if not entries: raise RuntimeError('Beanstalk did not return tail logs.')
          blocked=re.compile(r'password|secret|credential|token|APP_KEY|DB_PASS|Authorization|PRIVATE KEY',re.I)
          for entry in entries:
              data=urllib.request.urlopen(entry['Message'],timeout=30).read()
              if zipfile.is_zipfile(io.BytesIO(data)):
                  archive=zipfile.ZipFile(io.BytesIO(data))
                  logs=[(path,archive.read(path)) for path in archive.namelist() if any(x in path for x in ['eb-engine.log','eb-hooks.log','error_log'])]
              else:
                  logs=[('Beanstalk tail logs',data)]
              for path,body in logs:
                  print('LOG '+path)
                  lines=body.decode('utf-8','replace').splitlines()
                  for line in lines[-300:]:
                      if re.search(r'Application error [A-F0-9]{12} [A-Za-z0-9_\\]+ /[A-Za-z0-9_./-]+:[0-9]+',line): print(re.search(r'Application error [A-F0-9]{12} [A-Za-z0-9_\\]+ /[A-Za-z0-9_./-]+:[0-9]+',line).group(0))
                      elif 'DB_ADMIN_SECRET_ARN is not configured.' in line: print('Bootstrap: DB_ADMIN_SECRET_ARN is not configured.')
                      elif 'AWS Secrets Manager SDK is unavailable.' in line: print('Bootstrap: AWS Secrets Manager SDK is unavailable.')
                      elif 'Database administrator secret is malformed.' in line: print('Bootstrap: Database administrator secret is malformed.')
                      elif 'Database administrator secret is incomplete.' in line: print('Bootstrap: Database administrator secret is incomplete.')
                      elif blocked.search(line): print('[sensitive log line omitted]')
                      else: print(line[:1600])
          PY

  visitors:
    name: Inspect only visitor aggregates and worker timing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::466401734428:role/WaithakaGitHubDeployRole
          aws-region: af-south-1
          allowed-account-ids: '466401734428'
          retry-max-attempts: 2
          role-session-name: waithaka-visitor-diagnostics
      - name: Read public snapshot and inspect exact environment without sending mail or social jobs
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,subprocess,time,urllib.request
          def aws(*args):
              result=subprocess.run(['aws',*args,'--region','af-south-1','--output','json','--no-cli-pager'],capture_output=True,text=True,timeout=45)
              if result.returncode: raise RuntimeError('AWS diagnostic request failed: '+args[0]+'/'+args[1])
              return json.loads(result.stdout or '{}')
          if aws('sts','get-caller-identity').get('Account')!='466401734428':raise RuntimeError('Wrong workload account')
          allowed={'enabled','server_time','timezone','month_key','year_key','month_label','year_label','refresh_after','now','month','year','as_of'}
          def public():
              request=urllib.request.Request('https://www.waithakandegwa.com/api/visitor-statistics',headers={'Cache-Control':'no-cache','User-Agent':'Waithaka-Visitor-Diagnostics/1.0'})
              with urllib.request.urlopen(request,timeout=30) as response:data=json.load(response)
              print('Public visitor snapshot:',json.dumps({k:v for k,v in data.items() if k in allowed}),flush=True)
          public()
          resources=aws('elasticbeanstalk','describe-environment-resources','--environment-name','waithaka-ndegwa-production')
          ids=[item['Id'] for item in resources.get('EnvironmentResources',{}).get('Instances',[])]
          if not 1<=len(ids)<=4 or any(not re.fullmatch(r'i-[a-f0-9]{8,17}',i) for i in ids):raise RuntimeError('Unexpected environment instances')
          details=aws('ec2','describe-instances','--instance-ids',*ids)
          owned=[]
          for reservation in details.get('Reservations',[]):
              for instance in reservation.get('Instances',[]):
                  tags={t['Key']:t['Value'] for t in instance.get('Tags',[])}
                  if tags.get('elasticbeanstalk:environment-name')!='waithaka-ndegwa-production' or instance.get('State',{}).get('Name')!='running':raise RuntimeError('Instance is outside the target environment')
                  owned.append(instance['InstanceId'])
          if set(owned)!=set(ids):raise RuntimeError('Incomplete target verification')
          command=r'''set -eu
          cd /var/app/current
          echo WN_TIMER
          systemctl show waithaka-worker.timer -p ActiveState -p SubState -p LastTriggerUSec -p NextElapseUSecMonotonic --no-pager || true
          echo WN_WORKER
          systemctl show waithaka-worker.service -p ActiveState -p SubState -p Result -p ExecMainStatus -p ExecMainStartTimestamp -p ExecMainExitTimestamp --no-pager || true
          php <<'PHP'
          <?php
          ini_set('display_errors','0');ini_set('zend.exception_ignore_args','1');
          try {
            require 'app/environment.php';
            $env=json_decode((string)shell_exec('/opt/elasticbeanstalk/bin/get-config environment'),true,64,JSON_THROW_ON_ERROR);
            foreach($env as$k=>$v)if(preg_match('/^[A-Z][A-Z0-9_]*$/D',(string)$k)&&is_scalar($v))putenv($k.'='.$v);unset($env,$k,$v);
            require_once 'vendor/autoload.php';
            $arn=(string)getenv('WORKER_APP_SECRET_ARN');
            if(!preg_match('~^arn:aws:secretsmanager:af-south-1:466401734428:secret:waithaka-ndegwa-production-runtime-[A-Za-z0-9]+$~D',$arn))throw new RuntimeException('Wrong runtime boundary');
            $client=new \Aws\SecretsManager\SecretsManagerClient(['version'=>'2017-10-17','region'=>'af-south-1','http'=>['connect_timeout'=>5,'timeout'=>15]]);
            $secret=$client->getSecretValue(['SecretId'=>$arn]);$values=json_decode($secret['SecretString'],true,32,JSON_THROW_ON_ERROR);
            foreach(['APP_KEY','DB_USERNAME','DB_PASSWORD']as$k){if(!isset($values[$k])||!is_string($values[$k])||$values[$k]===''||str_contains($values[$k],"\0"))throw new RuntimeException('Invalid runtime field');putenv($k.'='.$values[$k]);}
            unset($values,$secret,$client,$arn,$k);require 'app/bootstrap.php';
            $out=['installed'=>installed(),'environment'=>app_config('app_env'),'delivery_worker_enabled'=>(bool)app_config('worker_enabled',false),'analytics_enabled'=>setting('google.analytics_enabled','1')==='1'];
            $connection=publishing_connection('google_analytics');$out['connection_connected']=($connection['status']??'')==='connected';$out['property_selected']=preg_match('~^properties/[0-9]+$~D',(string)($connection['selected_resource']??''))===1;unset($connection);
            $out['before']=visitor_statistics_payload();
            try{visitor_statistics_refresh(true);$out['targeted_refresh']='completed';}catch(Throwable $e){$out['targeted_refresh']='not_confirmed';$out['refresh_error_class']=get_class($e);}
            $s=comm_get('visitor.statistics');$out['after']=visitor_statistics_payload();
            foreach(['attempted','binding_at','active_at','month_at','year_at','active_window']as$k)if(isset($s[$k])&&is_int($s[$k]))$out[$k]=$s[$k];
            foreach(['status','realtime_status','month_status','year_status','active_mode','monthly_metric','yearly_metric']as$k){$v=$s[$k]??null;if(is_string($v)&&preg_match('/^[A-Za-z0-9 _-]{1,80}$/D',$v))$out[$k]=$v;}
            $out['realtime_thresholded']=!empty($s['realtime_shape']['thresholded']);$out['realtime_rows']=(int)($s['realtime_shape']['rows']??-1);
            echo 'WN_VISITOR_JSON:'.json_encode($out,JSON_THROW_ON_ERROR|JSON_UNESCAPED_SLASHES).PHP_EOL;
          }catch(Throwable $e){echo 'WN_VISITOR_JSON:'.json_encode(['diagnostic_error_class'=>get_class($e),'file'=>basename($e->getFile()),'line'=>$e->getLine()],JSON_THROW_ON_ERROR).PHP_EOL;exit(1);}
          PHP
          '''
          response=aws('ssm','send-command','--instance-ids',*ids,'--document-name','AWS-RunShellScript','--comment','Inspect visitor aggregates only; no mail, payment or social delivery','--timeout-seconds','60','--parameters',json.dumps({'commands':[command],'executionTimeout':['120']}))
          command_id=response['Command']['CommandId']
          for instance in ids:
              result={}
              for attempt in range(30):
                  try:result=aws('ssm','get-command-invocation','--command-id',command_id,'--instance-id',instance)
                  except RuntimeError:result={}
                  if result.get('Status') in ['Success','Failed','Cancelled','TimedOut']:break
                  time.sleep(4)
              print('Visitor diagnostic command status:',result.get('Status','not confirmed'),flush=True)
              for line in result.get('StandardOutputContent','').splitlines():
                  if line.startswith('WN_VISITOR_JSON:'):
                      data=json.loads(line.split(':',1)[1]);print('Visitor runtime:',json.dumps(data),flush=True)
                  elif line in ['WN_TIMER','WN_WORKER'] or re.fullmatch(r'(ActiveState|SubState|Result|ExecMainStatus|ExecMainStartTimestamp|ExecMainExitTimestamp|LastTriggerUSec|NextElapseUSecMonotonic)=[A-Za-z0-9 :+.,/_-]*',line):print(line,flush=True)
              if result.get('Status')!='Success':raise RuntimeError('Visitor diagnostic did not complete; raw stderr intentionally withheld')
          public()
          PY
