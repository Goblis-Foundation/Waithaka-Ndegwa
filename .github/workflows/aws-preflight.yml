name: AWS production preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/aws-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose OIDC identity and STS response without exposing tokens
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.parse, urllib.error, xml.etree.ElementTree as ET
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token = json.load(urllib.request.urlopen(req))['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          keys = ('iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner_id', 'ref', 'job_workflow_ref')
          print('OIDC identity:', json.dumps({k: claims.get(k) for k in keys}))
          data = urllib.parse.urlencode({'Action':'AssumeRoleWithWebIdentity', 'Version':'2011-06-15', 'RoleArn':'arn:aws:iam::466401734428:role/WaithakaGitHubDeployRole', 'RoleSessionName':'waithaka-oidc-diagnosis', 'WebIdentityToken':token, 'DurationSeconds':'900'}).encode()
          try:
              urllib.request.urlopen(urllib.request.Request('https://sts.af-south-1.amazonaws.com/',data=data),timeout=30).read()
              print('STS token exchange succeeded; credentials intentionally omitted.')
          except urllib.error.HTTPError as error:
              root = ET.fromstring(error.read())
              for element in root.iter():
                  if element.tag.rsplit('}',1)[-1] in ('Code','Message'): print(element.tag.rsplit('}',1)[-1] + ': ' + (element.text or ''))
          PY
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::466401734428:role/WaithakaGitHubDeployRole
          aws-region: af-south-1
          allowed-account-ids: '466401734428'
          retry-max-attempts: 2
          role-session-name: waithaka-production-preflight
      - name: Verify workload account and inspect existing environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 466401734428
          aws elasticbeanstalk describe-environments --environment-names waithaka-ndegwa-production --region af-south-1
          aws elasticbeanstalk describe-events --environment-name waithaka-ndegwa-production --region af-south-1 --max-records 25
      - name: Inspect startup logs without publishing credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,json,time,urllib.request,zipfile,io,re
          def aws(*a):
              r=subprocess.run(['aws',*a,'--region','af-south-1','--output','json'],capture_output=True,text=True)
              if r.returncode: raise RuntimeError(r.stderr)
              return json.loads(r.stdout or '{}')
          name='waithaka-ndegwa-production'
          aws('elasticbeanstalk','request-environment-info','--environment-name',name,'--info-type','tail')
          for attempt in range(12):
              time.sleep(10)
              entries=aws('elasticbeanstalk','retrieve-environment-info','--environment-name',name,'--info-type','tail').get('EnvironmentInfo',[])
              if entries: break
          if not entries: raise RuntimeError('Beanstalk did not return tail logs.')
          blocked=re.compile(r'password|secret|credential|token|APP_KEY|DB_PASS|Authorization|PRIVATE KEY',re.I)
          for entry in entries:
              data=urllib.request.urlopen(entry['Message'],timeout=30).read()
              archive=zipfile.ZipFile(io.BytesIO(data))
              for path in archive.namelist():
                  if any(x in path for x in ['eb-engine.log','eb-hooks.log','error_log']):
                      print('LOG '+path)
                      lines=archive.read(path).decode('utf-8','replace').splitlines()
                      for line in lines[-120:]:
                          if blocked.search(line): print('[sensitive log line omitted]')
                          else: print(line[:1600])
          PY
