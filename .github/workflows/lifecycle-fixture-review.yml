name: Lifecycle fixture date review
on:
  push:
    branches: ['feature/opportunity-lifecycle-20261104']
    paths: ['.github/workflows/lifecycle-fixture-review.yml']
permissions:
  contents: write
jobs:
  review:
    if: github.repository == 'Goblis-Foundation/Waithaka-Ndegwa' && github.actor == 'iwaithakaw'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Update only synthetic test dates and explicit rolling-deadline handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name,var in [('tests/curated_opportunities_database.php','entry'),('tests/opportunity_guides_database.php','e'),('tests/opportunity_lifecycle_database.php','e')]:
              p=Path(name);s=p.read_text();old="if($"+var+"['deadline_iso']!==null)";assert old in s;s=s.replace(old,'',1);p.write_text(s)
          p=Path('app/opportunity_lifecycle_policy.php');s=p.read_text();old="if(isset($f['deadline']))return ['at'=>(int)$f['deadline'],'precision'=>'exact'];";assert old in s;s=s.replace(old,old+"\n    if(($f['deadline_mode']??'')==='rolling')return ['at'=>null,'precision'=>'unknown'];",1);p.write_text(s)
          p=Path('tests/opportunity_lifecycle_test.php');s=p.read_text();old="echo 'PASS: '";assert old in s;s=s.replace(old,"$r['fields']['deadline']=null;$r['fields']['deadline_mode']='rolling';olt(ol_boundary($r)['at']===null,'Explicit rolling status overrides a legacy date seed.');\n"+old,1);p.write_text(s)
          Path('.github/workflows/lifecycle-fixture-review.yml').unlink()
          PY
          php tests/opportunity_lifecycle_test.php
          php -l tests/opportunity_lifecycle_database.php
          git diff --check
      - name: Record only these reviewed feature-branch edits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess,urllib.request,pathlib
          repo='Goblis-Foundation/Waithaka-Ndegwa';branch='feature/opportunity-lifecycle-20261104';api='https://api.github.com/repos/'+repo
          def call(method,endpoint,payload=None):
              req=urllib.request.Request(api+endpoint,data=None if payload is None else json.dumps(payload).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30)as response:return json.load(response)
          head=call('GET','/git/ref/heads/'+branch)['object']['sha'];assert head==os.environ['GITHUB_SHA']
          allowed={'tests/curated_opportunities_database.php','tests/opportunity_guides_database.php','tests/opportunity_lifecycle_database.php','app/opportunity_lifecycle_policy.php','tests/opportunity_lifecycle_test.php','.github/workflows/lifecycle-fixture-review.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines());assert changed==allowed
          entries=[]
          for name in sorted(changed):
              p=pathlib.Path(name);sha=call('POST','/git/blobs',{'content':p.read_text(),'encoding':'utf-8'})['sha']if p.exists()else None
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          base=call('GET','/git/commits/'+head)['tree']['sha'];tree=call('POST','/git/trees',{'base_tree':base,'tree':entries})
          commit=call('POST','/git/commits',{'message':'Use future-only disposable fixtures and honour explicit rolling deadlines','tree':tree['sha'],'parents':[head]})
          call('PATCH','/git/refs/heads/'+branch,{'sha':commit['sha'],'force':False});print(json.dumps({'commit':commit['sha']}))
          PY
