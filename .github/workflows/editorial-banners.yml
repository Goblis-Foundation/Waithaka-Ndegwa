name: Editorial banners and rolling opportunities
on:
  pull_request:
  workflow_run:
    workflows: ['Deploy production']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: wk-ci-fixture-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pwk-ci-fixture-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, curl, dom, mbstring, fileinfo, openssl, gd, zip
          tools: composer:v2
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
      - name: Check banner output, cache identities and aggregate diagnostics
        run: |
          php -l app/editorial_banners.php
          php -l assets/editorial-banner.php
          php tests/editorial_banners_test.php
          php tests/opportunity_review_health_test.php
          python3 -B tests/opportunity_review_health_test.py
          bash -n .platform/hooks/postdeploy/39_opportunity_lifecycle.sh
          bash -n .platform/hooks/postdeploy/40_rolling_opportunities.sh
      - name: Rehearse publication, editorial RSS and lifecycle in disposable databases
        env:
          WK_TEST_ALLOW_WRITES: '1'
          WK_TEST_DB_HOST: 127.0.0.1
          WK_TEST_DB_PORT: ${{ job.services.mysql.ports[3306] }}
          WK_TEST_DB_USER: root
          WK_TEST_DB_PASS: wk-ci-fixture-only
        run: |
          php tests/rolling_opportunities_database.php
          php tests/opportunity_lifecycle_database.php
      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_run'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated verification browser
        if: github.event_name == 'workflow_run'
        run: |
          npm install --prefix "$RUNNER_TEMP/banner-browser" --no-package-lock --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/banner-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Inspect live pages without submitting forms
        if: github.event_name == 'workflow_run'
        env:
          NODE_PATH: ${{ runner.temp }}/banner-browser/node_modules
          ARTICLE_EVIDENCE_DIR: ${{ runner.temp }}/editorial-banners-evidence
        run: node tests/editorial_banners_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_run'
        with:
          name: editorial-banners-live-evidence
          path: ${{ runner.temp }}/editorial-banners-evidence
          if-no-files-found: ignore
          retention-days: 14
