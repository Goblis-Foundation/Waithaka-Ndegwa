name: Prepare Filesystem security patch
on:
  push:
    branches: ['publish/africa-opportunities-16-20261104']
    paths: ['.github/workflows/prepare-filesystem-security-fix.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'Goblis-Foundation/Waithaka-Ndegwa' && github.actor == 'iwaithakaw'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, dom, mbstring, fileinfo, openssl, gd, zip
          tools: composer:v2
          coverage: none
      - name: Resolve only the upstream Filesystem patch
        run: |
          cp composer.lock "$RUNNER_TEMP/composer-before.lock"
          composer update symfony/filesystem:7.4.23 --minimal-changes --no-install --no-interaction --no-progress --no-scripts --no-plugins
          composer validate --strict
          composer audit --locked --no-interaction
          git diff --exit-code -- composer.json
          git diff -- composer.lock
      - name: Verify the package delta and create an unreferenced lockfile blob for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          before=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'composer-before.lock').read_text())
          lock=pathlib.Path('composer.lock').read_text()
          after=json.loads(lock)
          old={p['name']:p for p in before['packages']}
          new={p['name']:p for p in after['packages']}
          assert old.keys()==new.keys(), 'Package set changed'
          changed=[name for name in old if old[name]!=new[name]]
          assert changed==['symfony/filesystem'], changed
          assert new['symfony/filesystem']['version']=='v7.4.23'
          assert before['content-hash']==after['content-hash'] and before['packages-dev']==after['packages-dev']
          payload=json.dumps({'content':lock,'encoding':'utf-8'}).encode()
          request=urllib.request.Request('https://api.github.com/repos/Goblis-Foundation/Waithaka-Ndegwa/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
          print(json.dumps({'blob':result['sha'],'sha256':hashlib.sha256(lock.encode()).hexdigest(),'changed_packages':changed,'version':new['symfony/filesystem']['version'],'reference':new['symfony/filesystem']['source']['reference']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: filesystem-security-lockfile
          path: composer.lock
          retention-days: 3
