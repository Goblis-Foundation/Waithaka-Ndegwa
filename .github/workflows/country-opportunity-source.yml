name: Country opportunity source
on:
  push:
    branches: ['feature/country-opportunities-20261105']
    paths: ['.github/workflows/country-opportunity-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive committed source
        run: git archive --format=zip --output="$RUNNER_TEMP/country-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: country-development-source
          path: ${{ runner.temp }}/country-source.zip
          retention-days: 1
