# The application relies on its reviewed .htaccess to route requests and protect
# private source directories. Verify this path on the selected Beanstalk platform.
<Directory "/var/app/current">
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>
# The selected Beanstalk proxy is Apache. Bound large authenticated media uploads.
<Location "/write/media">
    LimitRequestBody 538968064
</Location>
<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,MinRate=500 body=20-600,MinRate=65536
</IfModule>
Timeout 120
ProxyTimeout 120
